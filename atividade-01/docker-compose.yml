# =============================================================================
# Atividade 01 - Airflow + FakeStore API
# Airflow 2.9.3 (LocalExecutor) + 2 PostgreSQL: metadados do Airflow e destino
# das métricas. Credenciais abaixo são só para desenvolvimento local.
# =============================================================================
# Subir:                      docker compose up -d
#   O airflow-init cria ./logs com o dono certo; nenhum passo manual antes.
#   Opcional (Linux/WSL): echo "AIRFLOW_UID=$(id -u)" > .env, para os arquivos
#   de log saírem com o seu usuário como dono (sem isso, UID 50000).
# Ver saúde:                  docker compose ps
# Rodar os testes (pytest):   docker compose run --rm testes
# Parar sem perder dados:     docker compose stop
# Derrubar e APAGAR bancos:   docker compose down -v
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  # Roda com o seu UID: os logs gravados em ./logs ficam com dono certo,
  # sem precisar de chmod.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "atividade-01-dev"
    # Horários na UI em Brasília (a DAG define o fuso dela com zoneinfo).
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres-meta:
      condition: service_healthy
  networks:
    - airflow-net

services:
  # ── Metadados do Airflow (DAG runs, estado das tasks, connections, pools) ──
  postgres-meta:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - airflow-net

  # ── Destino: onde a DAG grava as métricas por categoria ─────────────────────
  postgres-ecommerce:
    image: postgres:16
    environment:
      POSTGRES_USER: ecommerce
      # Senha que não aparece no código: o Airflow mascara a senha das
      # Connections em todo log, e com "ecommerce" o nome da DAG virava
      # "***_metricas" (e o link do alerta quebrava). POSTGRES_PASSWORD só vale
      # na criação do volume; num banco que já existe, trocar com ALTER USER.
      POSTGRES_PASSWORD: ecommerce_dev_2026
      POSTGRES_DB: ecommerce
    volumes:
      - postgres-ecommerce-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"   # inspeção de fora: localhost:5434
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ecommerce"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - airflow-net

  # ── Inicialização (roda uma vez e sai) ──────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    # Root só neste serviço, que roda uma vez e sai: precisa dar a ./logs o dono
    # que o scheduler e o webserver vão usar. Sem isso, o Docker cria a pasta do
    # bind mount como root e o Airflow, rodando como AIRFLOW_UID, cai com
    # "Unable to configure handler 'processor'". Mesmo esquema do compose oficial.
    user: "0:0"
    # Usa o entrypoint da imagem (não /bin/bash direto): é ele que registra o
    # AIRFLOW_UID como usuário dentro do container. Sem isso o Airflow cai com
    # "getpwuid(): uid not found". Com "bash" como 1º argumento, o entrypoint
    # faz esse registro e depois executa o bash com o script abaixo.
    command:
      - bash
      - -c
      - |
        # set -e: para no primeiro erro. Sem ele, uma falha no migrate passa
        # e o echo do fim faz o init sair 0 (sucesso) mesmo quebrado.
        set -e
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname Atividade \
          --role Admin --email admin@example.com
        # Connection do banco destino. "add" falha se o id já existe; apagar
        # antes deixa o init re-rodável e mantém a connection igual ao arquivo.
        airflow connections delete postgres_ecommerce > /dev/null 2>&1 || true
        airflow connections add postgres_ecommerce \
          --conn-type postgres \
          --conn-host postgres-ecommerce --conn-port 5432 \
          --conn-login ecommerce --conn-password ecommerce_dev_2026 \
          --conn-schema ecommerce
        # Pool que limita as tasks mapeadas a 2 simultâneas. "set" cria ou
        # atualiza, então já é re-rodável.
        airflow pools set ecommerce_pool 2 "Limita calcular_metricas a 2 por vez"
        # De novo no fim: os comandos acima, como root, podem ter criado arquivo
        # em ./logs que o Airflow não conseguiria escrever depois.
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        echo "=== Airflow inicializado: http://localhost:8080 ==="
    depends_on:
      postgres-meta:
        condition: service_healthy
      postgres-ecommerce:
        condition: service_healthy

  # ── Scheduler ───────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      # CMD-SHELL (não CMD): com CMD o $${HOSTNAME} não é expandido e o
      # scheduler aparece unhealthy mesmo funcionando.
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Webserver (UI) ──────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Testes (pytest) ─────────────────────────────────────────────────────────
  # Não sobe com "up" (profile). Rodar: docker compose run --rm testes
  # Mesma imagem do Airflow, para testar contra a versão que roda; o pytest é
  # instalado na hora pelo próprio entrypoint da imagem.
  testes:
    <<: *airflow-common
    profiles: ["testes"]
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: "pytest==8.3.3"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./tests:/opt/airflow/tests
      - ./logs:/opt/airflow/logs
    command: ["bash", "-c", "python -m pytest -q -p no:cacheprovider /opt/airflow/tests"]

volumes:
  postgres-meta-data:
  postgres-ecommerce-data:

networks:
  airflow-net:
    driver: bridge
